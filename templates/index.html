<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Sentiment Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg mx-auto" style="max-width: 800px;">
            <div class="card-header bg-primary text-white text-center">
                <h1><i class="bi bi-chat-heart"></i> Product Review Analyzer</h1>
            </div>
            <div class="card-body p-4">
                <form action="/predict" method="POST">
                    <div class="mb-4">
                        <label for="review" class="form-label h4">Enter Product Review:</label>
                        <textarea class="form-control fs-5" id="review" name="review" rows="4" 
                        placeholder="Type your product experience here..." required></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-activity"></i> Analyze
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted">
                Powered by Machine Learning | Logistic Regression | Med_agdid 
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
